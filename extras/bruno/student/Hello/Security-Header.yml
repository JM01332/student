info:
  name: Security-Header
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/hello/"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['strict-transport-security']
      operator: contains
      value: max-age=31536000
    - expression: res.headers['x-content-type-options']
      operator: eq
      value: nosniff
    - expression: res.headers['x-frame-options']
      operator: eq
      value: SAMEORIGIN
    - expression: res.headers['content-security-policy']
      operator: contains
      value: default-src 'self'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
