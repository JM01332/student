info:
  name: Hello
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/hello/"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.Hello
      operator: eq
      value: World

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
