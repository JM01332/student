info:
  name: Liveness
  type: http
  seq: 6

http:
  method: GET
  url: "{{healthUrl}}/liveness"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: up

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
