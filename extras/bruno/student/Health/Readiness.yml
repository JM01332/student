info:
  name: Readiness
  type: http
  seq: 5

http:
  method: GET
  url: "{{healthUrl}}/readiness"
  headers:
    - name: Accept
      value: application/json

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.db
      operator: eq
      value: up

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
