info:
  name: DB neu laden
  type: http
  seq: 1

http:
  method: QUERY
  url: "{{devUrl}}/db_populate"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.db_populate
      operator: eq
      value: success

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
