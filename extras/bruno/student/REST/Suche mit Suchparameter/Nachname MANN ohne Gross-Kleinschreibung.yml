info:
  name: Nachname MANN ohne Gross-Kleinschreibung
  type: http
  seq: 16

http:
  method: GET
  url: "{{restUrl}}?nachname=MANN"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: length
      value: "1"
    - expression: res.body.content[0].nachname
      operator: eq
      value: Mustermann
    - expression: res.body.page.total_elements
      operator: eq
      value: "1"
    - expression: res.body.page.total_pages
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
