info:
  name: Nachname MANN ohne Gross-Kleinschreibung
  type: http
  seq: 3

http:
  method: GET
  url: "{{restUrl}}?nachname=MANN"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
    - expression: res.body[0].nachname
      operator: eq
      value: Mustermann

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
