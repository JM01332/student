info:
  name: Vorhandene Email erika.musterfrau
  type: http
  seq: 4

http:
  method: GET
  url: "{{restUrl}}?email=erika.musterfrau@h-ka.de"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.content
      operator: length
      value: "1"
    - expression: res.body.content[0].vorname
      operator: eq
      value: Erika
    - expression: res.body.page.total_elements
      operator: eq
      value: "1"
    - expression: res.body.page.total_pages
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
