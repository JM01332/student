info:
  name: Teil des Nachnamens muster
  type: http
  seq: 2

http:
  method: GET
  url: "{{restUrl}}?nachname=muster"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "2"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
