info:
  name: Nicht-vorhandener Nachname
  type: http
  seq: 18

http:
  method: GET
  url: "{{restUrl}}?nachname=xyz"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json
    - expression: res.body.title
      operator: eq
      value: Not Found

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
