info:
  name: Andere Version mit ETag
  type: http
  seq: 12

http:
  method: GET
  url: "{{restUrl}}/:id"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Accept
      value: application/json
    - name: If-None-Match
      value: '"99"'
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['etag']
      operator: matches
      value: '^"0"$'
    - expression: res.body.id
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
