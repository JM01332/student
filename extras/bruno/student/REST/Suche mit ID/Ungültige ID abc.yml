info:
  name: Ungültige ID abc
  type: http
  seq: 10

http:
  method: GET
  url: "{{restUrl}}/:id"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Accept
      value: application/json
  params:
    - name: id
      value: abc
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
