info:
  name: Vorhandene ID 20 ohne Pruefungsleistungen
  type: http
  seq: 9

http:
  method: GET
  url: "{{restUrl}}/:id"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Accept
      value: application/json
  params:
    - name: id
      value: "20"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.nachname
      operator: eq
      value: Musterfrau
    - expression: res.body.pruefungsleistungen
      operator: isEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
