info:
  name: Unveraendert mit ETag
  type: http
  seq: 5

http:
  method: GET
  url: "{{restUrl}}/:id"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Accept
      value: application/json
    - name: If-None-Match
      value: '"0"'
  params:
    - name: id
      value: "1"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "304"
    - expression: res.headers['etag']
      operator: eq
      value: '"0"'

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
