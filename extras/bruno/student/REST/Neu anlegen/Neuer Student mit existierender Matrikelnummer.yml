info:
  name: Neuer Student mit existierender Matrikelnummer
  type: http
  seq: 23

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "matrikelnummer": "123456",
          "nachname": "Rest",
          "vorname": "Rita",
          "email": "rita.andere@h-ka.de",
          "username": "rita",
          "adresse": {
              "plz": "76133",
              "ort": "Karlsruhe"
          },
          "pruefungsleistungen": [
              {
                  "modul": "Softwareengineering",
                  "note": 1.3,
                  "semester": "WS 2026/27"
              }
          ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
