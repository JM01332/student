info:
  name: Neuer Student
  type: http
  seq: 21

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "matrikelnummer": "777777",
          "nachname": "Rest",
          "vorname": "Rita",
          "email": "rita.rest@h-ka.de",
          "username": "rita",
          "adresse": {
              "plz": "76133",
              "ort": "Karlsruhe"
          },
          "pruefungsleistungen": [
              {
                  "modul": "Softwareengineering",
                  "note": 1.3,
                  "semester": "WS 2026/27"
              }
          ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.headers.location
      operator: matches
      value: \/rest\/[1-9]\d*$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
