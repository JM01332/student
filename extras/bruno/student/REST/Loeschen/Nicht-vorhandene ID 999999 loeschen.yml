info:
  name: Nicht-vorhandene ID 999999 loeschen
  type: http
  seq: 34

http:
  method: DELETE
  url: "{{restUrl}}/:id"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  params:
    - name: id
      value: "999999"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
