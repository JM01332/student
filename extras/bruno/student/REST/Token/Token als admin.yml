info:
  name: Token als admin
  type: http
  seq: 6

http:
  method: QUERY
  url: "{{baseUrl}}/auth/token"
  body:
    type: json
    data: |-
      {
          "username": "{{username}}",
          "password": "{{password}}"
      }

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar('accessToken', '');
    - type: after-response
      code: |-
        const body = res.getBody();
        if (res.getStatus() === 200 && typeof body?.token === 'string' && body.token.length > 0) {
          bru.setVar('accessToken', body.token);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.token
      operator: matches
      value: .\..+\..+
    - expression: res.body.expires_in
      operator: eq
      value: "1800"
    - expression: res.body.rollen
      operator: isArray
    - expression: res.body.rollen
      operator: length
      value: "1"
    - expression: res.body.rollen[0]
      operator: eq
      value: ADMIN

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
