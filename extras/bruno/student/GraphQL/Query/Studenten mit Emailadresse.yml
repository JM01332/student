info:
  name: Studenten mit Emailadresse
  type: graphql
  seq: 42

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    query: |-
      {
        studenten(suchparameter: {email: "erika.musterfrau@h-ka.de"}) {
          id
          nachname
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.studenten
      operator: length
      value: "1"
    - expression: res.body.data.studenten[0].nachname
      operator: eq
      value: "Musterfrau"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
