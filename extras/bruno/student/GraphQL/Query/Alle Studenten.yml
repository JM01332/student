info:
  name: Alle Studenten
  type: graphql
  seq: 43

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: Authorization
      value: "Bearer {{accessToken}}"
  body:
    query: |-
      {
        studenten(suchparameter: null) {
          id
          nachname
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.studenten
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
