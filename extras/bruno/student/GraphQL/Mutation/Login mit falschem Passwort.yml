info:
  name: Login mit falschem Passwort
  type: graphql
  seq: 47

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  body:
    query: |-
      mutation {
        login(username: "admin", password: "FALSCH") {
          token
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isNull
    - expression: res.body.errors
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
