info:
  name: Login als admin
  type: graphql
  seq: 46

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  body:
    query: |-
      mutation {
        login(username: "admin", password: "{{password}}") {
          token
          expiresIn
          roles
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.login.token
      operator: isString
    - expression: res.body.data.login.expiresIn
      operator: eq
      value: "1800"
    - expression: res.body.data.login.roles[0]
      operator: eq
      value: "ADMIN"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
