# Aufruf:   docker compose up
#           docker compose down
#
# Ersteinrichtung (Volumes, TLS, Datenbank): siehe ReadMe.md in diesem Verzeichnis

# https://github.com/compose-spec/compose-spec/blob/master/schema/compose-spec.json

---
services:
  postgres:
    # https://github.com/docker-library/postgres/blob/master/19/trixie/Dockerfile
    image: postgres:19beta4-trixie
    ports:
      - published: 5432
        target: 5432

    # https://dev.to/danvixent/how-to-setup-postgresql-with-ssl-inside-a-docker-container-5f3
    # https://gist.github.com/mrw34/c97bb03ea1054afb551886ffc8b63c3b
    # https://stackoverflow.com/questions/55072221/deploying-postgresql-docker-with-ssl-certificate-and-key-with-volumes
    # ggf. "-c shared_buffers=64MB" statt 128 MB (default bei PostgreSQL 18)
    # ggf. "-c timezone='Europe/Berlin'" (default bei PostgreSQL 18)
    # ggf. "-c max_connections=10" statt 100
    #command: ["--ssl=on"]
    command:
      [
        "--ssl=on",
        "--ssl-cert-file=/var/lib/postgresql/19/docker/server.crt",
        "--ssl-key-file=/var/lib/postgresql/19/docker/server.key",
      ]
    volumes:
      # Image:   dhi.io/postgres:VERSION
      #- pg_data:/var/lib/postgresql/19/data
      # Image:   postgres:VERSION
      - pg_data:/var/lib/postgresql/19/docker
      - pg_tablespace:/tablespace
      - pg_init:/init:ro
      # UNIX-Socket .s.PGSQL.5432.lock
      #- pg_run:/tmp
    # https://docs.docker.com/compose/how-tos/environment-variables/set-environment-variables
    environment:
      TZ: Europe/Berlin
      # https://www.postgresql.org/docs/current/libpq-envars.html
      # default bei PostgreSQL 18
      #PGTZ: Europe/Berlin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
      # siehe /var/lib/postgresql/18/data/pg_hba.conf
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-local=scram-sha-256 --auth-host=scram-sha-256"
    secrets: [db_password]
    networks: [acme-network]
    user: "postgres:postgres"
    hostname: postgres
    container_name: postgres
    # https://docs.docker.com/reference/compose-file/services/#cap_drop
    # https://man7.org/linux/man-pages/man7/capabilities.7.html
    # https://linux.die.net/man/7/capabilities
    cap_drop: [ALL]
    # nur fuer die Ersteinrichtung ohne TLS einkommentieren (siehe ReadMe.md)
    #cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: [CMD, pg_isready, --dbname=postgres, --username=postgres]
      interval: 5s
      timeout: 2s
      retries: 2
      start_period: 5s
    restart: unless-stopped
    # https://docs.docker.com/compose/compose-file/deploy
    deploy:
      # https://docs.docker.com/compose/compose-file/deploy/#resources
      resources:
        limits:
          cpus: "0.5"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 512M

# /run/secrets/*
secrets:
  db_password:
    file: ./password.txt

volumes:
  pg_data:
    name: pg_data
    external: true
  pg_tablespace:
    name: pg_tablespace
    external: true
  pg_init:
    name: pg_init
    external: true

networks:
  acme-network:
    name: acme-network
