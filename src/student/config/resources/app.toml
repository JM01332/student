# Konfiguration für den Appserver "student"
# TOML = Tom's Obvious, Minimal Language

[server]
# host-binding = "127.0.0.1"
# port = 8000

[tls]
# key = "key.pem"
# certificate = "certificate.crt"

[logger]
# debug-level = false: nur INFO und höher, sonst auch DEBUG
debug-level = true

[db]
# dialect = "postgresql"
# name = "student"
# username = "student"
password = "p"
# Passwort des Superusers "postgres" (nur für db-populate)
password-admin = "p"
# host = "postgres": App im Docker-Netz, "localhost": App auf dem Host-Rechner
host = "localhost"
# SQL-Anweisungen von SQLAlchemy protokollieren
log-statements = true
# max. Wartezeit in Sekunden beim Verbindungsaufbau (Standard 2)
# connect-timeout = 2

[keycloak]
# App auf dem Host-Rechner, Keycloak über den veröffentlichten HTTPS-Port
host = "localhost"
port = 8843
# schema = "https"
# realm = "student"
# client-id = "student-client"
# certificate = "certificate.crt": unter resources/keycloak
# CLIENT_SECRET aus der Umgebung oder .env im Arbeitsverzeichnis
# Admin-REST-API (Benutzer anlegen/löschen) wie im Beispielprojekt
# admin = "admin"
admin-password = "p"
# csv = "extras/compose/postgres/init/student/csv/student.csv": für Keycloak neu laden

[graphql]
# Browser-Oberfläche unter /graphql; wegen der Content-Security-Policy (wie /docs)
# evtl. leer, getestet wird mit Bruno
graphiql-enabled = true

[dev]
# DB beim Start mit drop.sql, create.sql und den CSV-Testdaten neu laden
db-populate = true
# Keycloak-Benutzer beim Start aus der CSV-Datei neu laden (alle außer admin)
keycloak-populate = true
