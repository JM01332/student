[project]
name = "student"
version = "0.1.0"
description = "FastAPI-Appserver zur Verwaltung von Studierendendaten"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]

[project.scripts]
student = "student:main"

[build-system]
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.1.0,<10.0.0",
    "python-dotenv>=1.2.2,<2.0.0",
]
lint = [
    "ruff>=0.16.9,<1.0.0",
    "ty>=0.0.84,<1.0.0",
]

[tool.pytest.ini_options]
minversion = "9.1.0"
testpaths = ["tests/integration"]

[tool.ruff]
preview = true

[tool.ruff.lint]
select = [
    # https://docs.astral.sh/ruff/default-rules
    "YTT",   # flake8-2020 https://pypi.org/project/flake8-2020
    "ASYNC", # flake8-async https://github.com/python-trio/flake8-async
    "S",     # flake8-bandit https://github.com/tylerwince/flake8-bandit
    "BLE",   # flake8-blind-except https://github.com/elijahandrews/flake8-blind-except
    "B",     # flake8-bugbear https://github.com/PyCQA/flake8-bugbear
    "C4",    # flake8-comprehensions https://github.com/adamchainz/flake8-comprehensions
    "DTZ",   # flake8-datetimez https://github.com/pjknkda/flake8-datetimez
    "T10",   # flake8-debugger https://github.com/JBKahn/flake8-debugger
    "EXE",   # flake8-executable https://github.com/xuhdev/flake8-executable
    "FA",    # flake8-future-annotations https://github.com/TylerYep/flake8-future-annotations
    "INT",   # flake8-gettext https://github.com/cielavenir/flake8_gettext
    "ISC",   # flake8-implicit-str-concat https://github.com/flake8-implicit-str-concat/flake8-implicit-str-concat
    "LOG",   # flake8-logging https://github.com/adamchainz/flake8-logging
    "G",     # flake8-logging-format https://pypi.org/project/flake8-logging-format
    "PIE",   # flake8-pie https://github.com/sbdchd/flake8-pie
    "PYI",   # flake8-pyi https://github.com/pycqa/flake8-pyi
    "PT",    # flake8-pytest-style https://github.com/m-burst/flake8-pytest-style
    "RET",   # flake8-return https://github.com/afonasev/flake8-return
    "SIM",   # flake8-simplify https://github.com/MartinThoma/flake8-simplify
    "TC",    # flake8-type-checking https://github.com/snok/flake8-type-checking
    "PTH",   # flake8-use-pathlib https://gitlab.com/RoPP/flake8-use-pathlib
    "FLY",   # flynt https://github.com/ikamensh/flynt
    "I",     # isort https://github.com/PyCQA/isort
    "N",     # pep8-naming https://github.com/PyCQA/pep8-naming
    "PERF",  # Perflint https://github.com/tonybaloney/perflint
    "E",     # pycodestyle https://github.com/pycqa/pycodestyle
    "W",     # pycodestyle (warning)
    "D",     # pydocstyle https://github.com/jsh9/pydoclint
    "F",     # Pyflakes https://github.com/PyCQA/pyflakes
    "PGH",   # pygrep-hooks https://docs.astral.sh/ruff/default-rules/#pygrep-hooks-pgh
    "PL",    # Pylint https://pypi.org/project/pylint
    "UP",    # pyupgrade https://github.com/asottile/pyupgrade
    "FURB",  # refurb https://github.com/dosisod/refurb
    "RUF",   # Ruff-specific rules https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "TRY",   # tryceratops https://github.com/guilatrova/tryceratops
    # https://docs.astral.sh/ruff/rules
    "FAST", # FastAPI
    "FBT",  # flake8-boolean-trap https://github.com/pwoolvett/flake8_boolean_trap
    "A",    # flake8-builtins https://github.com/gforcada/flake8-builtins
    "COM",  # flake8-commas https://github.com/PyCQA/flake8-commas
    "RSE",  # flake8-raise https://github.com/jdufresne/flake8-raise
    "SLF",  # flake8-self
    "TID",  # flake8-tidy-imports https://github.com/adamchainz/flake8-tidy-imports
    "ARG",  # flake8-unused-arguments https://github.com/nhoad/flake8-unused-arguments
]
ignore = [
    # "multi-line-summary-first-line" statt "incorrect-blank-line-before-class" und "multi-line-summary-second-line"
    "incorrect-blank-line-before-class",
    "multi-line-summary-second-line",
    # https://github.com/astral-sh/ruff/issues/9216
    "missing-trailing-comma",
    "no-self-use",
    # UTF-8 ist default ab Python 3.15
    "unspecified-encoding",
]

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["assert", "undocumented-public-function"]
"tests/integration/**/*_test.py" = ["raise-vanilla-args"]

[tool.ruff.lint.pylint]
max-statements-in-try = 7

[tool.ty.environment]
python = "./.venv"
root = ["./src"]

[tool.uv]
required-version = ">=0.12.20"
default-groups = "all"
