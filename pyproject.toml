[project]
name = "student"
version = "0.1.0"
description = "FastAPI-Appserver zur Verwaltung von Studierendendaten"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.141.1,<1.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]

[project.scripts]
student = "student:main"

[build-system]
requires = ["uv_build>=0.12.20,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<1.0.0",
    "pytest>=9.1.0,<10.0.0",
]
lint = [
    "ruff>=0.16.9,<1.0.0",
    "ty>=0.0.84,<1.0.0",
]

[tool.pytest.ini_options]
minversion = "9.1.0"
testpaths = ["tests/integration"]

[tool.ruff]
preview = true

[tool.ty.environment]
python = "./.venv"
root = ["./src"]

[tool.uv]
required-version = ">=0.12.20"
default-groups = "all"
